<!DOCTYPE html>
<html lang="es" data-protegida="true">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turnos - Veterinaria La Mary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <script src="comun.js"></script>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-xl navbar-light bg-light no-imprimir">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Veterinaria La Mary</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto" id="menuNavegacion"></ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="container py-5">
            <h1 class="text-center mb-4">Gestión de turnos</h1>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">Nuevo turno</h2>

                    <div id="avisoDatos" class="alert alert-warning d-none" role="alert"></div>

                    <form id="formTurno">
                        <div class="mb-3">
                            <label for="idMascota" class="form-label">Mascota</label>
                            <select id="idMascota" class="form-select" required></select>
                        </div>

                        <div class="mb-3">
                            <label for="idVeterinario" class="form-label">Veterinario</label>
                            <select id="idVeterinario" class="form-select" required></select>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input type="date" id="fecha" class="form-control" required>
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label for="hora" class="form-label">Hora</label>
                                <input type="time" id="hora" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="motivo" class="form-label">Motivo de la consulta</label>
                            <input type="text" id="motivo" class="form-control" maxlength="150" required>
                        </div>

                        <div class="text-center">
                            <button type="submit" id="botonGuardarTurno" class="btn btn-primary">Registrar turno</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-5">
                <h2 class="text-center mb-4">Turnos registrados</h2>

                <div class="row g-3 align-items-end mb-3 no-imprimir">
                    <div class="col-12 col-md-5">
                        <label for="filtroVeterinario" class="form-label">Filtrar por veterinario</label>
                        <select id="filtroVeterinario" class="form-select"></select>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="filtroFecha" class="form-label">Filtrar por fecha</label>
                        <input type="date" id="filtroFecha" class="form-control">
                    </div>

                    <div class="col-12 col-md-3 d-grid">
                        <button type="button" id="botonLimpiarFiltros" class="btn btn-secondary">Limpiar filtros</button>
                    </div>
                </div>

                <p class="text-center">Total de turnos: <strong id="totalTurnos">0</strong></p>

                <div class="text-end mb-2">
                    <button type="button" id="botonExportarTurnos" class="btn btn-outline-secondary btn-sm">Exportar a CSV</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Mascota</th>
                                <th>Dueño</th>
                                <th>Veterinario</th>
                                <th>Motivo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaTurnos"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 no-imprimir">
        <p class="mb-0">© 2026 Veterinaria La Mary</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="turnos.js"></script>
</body>
</html>
