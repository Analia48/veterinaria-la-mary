<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mascotas - Veterinaria La Mary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <script src="mascotas.js" defer></script>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Veterinaria La Mary</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
                        <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link active" href="mascotas.html">Mascotas</a></li>
                        <li class="nav-item"><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="container py-5">
            <h1 class="text-center mb-4">Registro de mascotas</h1>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center">Nueva mascota</h2>

                    <form id="formMascota">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de la mascota</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="especie" class="form-label">Especie</label>
                            <select id="especie" class="form-select" required>
                                <option value="">Seleccionar</option>
                                <option value="Perro">Perro</option>
                                <option value="Gato">Gato</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="edad" class="form-label">Edad</label>
                            <input type="number" id="edad" class="form-control" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label for="dueno" class="form-label">Nombre del dueño</label>
                            <input type="text" id="dueno" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">Color</label>
                            <input type="text" id="color" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="peso" class="form-label">Peso (kg)</label>
                            <input type="number" id="peso" class="form-control" min="0" step="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label for="imagenMascota" class="form-label">Imagen de la mascota</label>
                            <input type="file" id="imagenMascota" class="form-control" accept="image/*">
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Guardar mascota</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-5">
                <h2 class="text-center mb-4">Mascotas registradas</h2>
                <div id="listaMascotas"></div>
            </div>
        </section>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">© 2026 Veterinaria La Mary</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
