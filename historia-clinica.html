<!DOCTYPE html>
<html lang="es" data-protegida="true">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historia clínica - Veterinaria La Mary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <script src="comun.js"></script>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-xl navbar-light bg-light no-imprimir">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Veterinaria La Mary</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto" id="menuNavegacion"></ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="container py-5">
            <h1 class="text-center mb-4">Historia clínica</h1>

            <div class="card shadow-sm no-imprimir">
                <div class="card-body">
                    <h2 class="text-center mb-4">Nuevo registro</h2>

                    <div id="avisoDatos" class="alert alert-warning d-none" role="alert"></div>

                    <form id="formHistoria">
                        <div class="mb-3">
                            <label for="idMascota" class="form-label">Mascota</label>
                            <select id="idMascota" class="form-select" required></select>
                        </div>

                        <div class="mb-3">
                            <label for="idVeterinario" class="form-label">Veterinario que atendió</label>
                            <select id="idVeterinario" class="form-select" required></select>
                        </div>

                        <div class="mb-3">
                            <label for="fecha" class="form-label">Fecha de la consulta</label>
                            <input type="date" id="fecha" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="motivo" class="form-label">Motivo de consulta</label>
                            <input type="text" id="motivo" class="form-control" maxlength="150" required>
                        </div>

                        <div class="mb-3">
                            <label for="diagnostico" class="form-label">Diagnóstico</label>
                            <textarea id="diagnostico" class="form-control" rows="2" maxlength="500" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="tratamiento" class="form-label">Tratamiento indicado</label>
                            <textarea id="tratamiento" class="form-control" rows="2" maxlength="500" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-4 mb-3">
                                <label for="peso" class="form-label">Peso (kg) <span class="text-muted">(opcional)</span></label>
                                <input type="number" id="peso" class="form-control" min="0.01" step="0.01">
                            </div>

                            <div class="col-12 col-md-4 mb-3">
                                <label for="temperatura" class="form-label">Temperatura (°C) <span class="text-muted">(opcional)</span></label>
                                <input type="number" id="temperatura" class="form-control" min="30" max="45" step="0.1">
                            </div>

                            <div class="col-12 col-md-4 mb-3">
                                <label for="proximoControl" class="form-label">Próximo control <span class="text-muted">(opcional)</span></label>
                                <input type="date" id="proximoControl" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones <span class="text-muted">(opcional)</span></label>
                            <textarea id="observaciones" class="form-control" rows="2" maxlength="500"></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" id="botonGuardarHistoria" class="btn btn-primary">Guardar registro</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-5">
                <h2 class="text-center mb-4">Historial clínico</h2>

                <div class="row g-3 align-items-end mb-3 no-imprimir">
                    <div class="col-12 col-md-6">
                        <label for="filtroMascota" class="form-label">Ver historial de</label>
                        <select id="filtroMascota" class="form-select"></select>
                    </div>

                    <div class="col-12 col-md-6 d-flex flex-wrap gap-2 justify-content-md-end">
                        <button type="button" id="botonImprimirHistorial" class="btn btn-outline-secondary btn-sm">Imprimir / PDF</button>
                        <button type="button" id="botonExportarHistorial" class="btn btn-outline-secondary btn-sm">Exportar a CSV</button>
                    </div>
                </div>

                <div id="detalleHistorial"></div>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 no-imprimir">
        <p class="mb-0">© 2026 Veterinaria La Mary</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="historia-clinica.js"></script>
</body>
</html>
