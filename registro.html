<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse - Veterinaria La Mary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <script src="comun.js"></script>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-xl navbar-light bg-light no-imprimir">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Veterinaria La Mary</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto" id="menuNavegacion"></ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="container py-5">
            <h1 class="text-center mb-4">Registrarse</h1>

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h2 class="text-center mb-4">Nuevo administrador</h2>

                            <form id="formRegistro" novalidate>
                                <div class="row">
                                    <div class="col-12 col-md-6 mb-3">
                                        <label for="nombre" class="form-label">Nombre</label>
                                        <input type="text" id="nombre" class="form-control" maxlength="50" autocomplete="given-name" required>
                                    </div>

                                    <div class="col-12 col-md-6 mb-3">
                                        <label for="apellido" class="form-label">Apellido</label>
                                        <input type="text" id="apellido" class="form-control" maxlength="50" autocomplete="family-name" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" class="form-control" maxlength="100" autocomplete="email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="usuario" class="form-label">Usuario</label>
                                    <input type="text" id="usuario" class="form-control" minlength="3" maxlength="30" autocomplete="username" required>
                                </div>

                                <div class="mb-3">
                                    <label for="clave" class="form-label">Contraseña</label>
                                    <input type="password" id="clave" class="form-control" minlength="6" autocomplete="new-password" required>
                                    <div class="form-text">Mínimo 6 caracteres.</div>
                                </div>

                                <div class="mb-3">
                                    <label for="clave2" class="form-label">Repetir contraseña</label>
                                    <input type="password" id="clave2" class="form-control" autocomplete="new-password" required>
                                </div>

                                <div class="text-center">
                                    <button type="submit" id="botonRegistrar" class="btn btn-primary">Crear cuenta</button>
                                </div>

                                <div id="mensajeRegistro" class="d-none" role="alert" aria-live="polite"></div>
                            </form>

                            <p class="text-center mt-4 mb-0">
                                ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 no-imprimir">
        <p class="mb-0">© 2026 Veterinaria La Mary</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="registro.js"></script>
</body>
</html>
