</head>

        <nav class="navbar navbar-expand-lg navbar-light bg-light">

                <a class="navbar-brand fw-bold" href="index.html">
                    Veterinaria La Mary
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>

                        <li class="nav-item">

                    </ul>

            </div>
        </nav>
    </header>

    <main>
        <section class="container py-5">

            <h1 class="text-center mb-4">
                Registro de veterinarios
            </h1>

            <div class="card shadow-sm">
                <div class="card-body">

                    <h2 class="text-center mb-4" id="tituloFormulario">
                        Nuevo veterinario
                    </h2>

                    <form id="formVeterinario">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre completo
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                class="form-control"
                                maxlength="100"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="especialidad" class="form-label">
                                Especialidad
                            </label>

                            <input
                                type="text"
                                id="especialidad"
                                class="form-control"
                                maxlength="100"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="matricula" class="form-label">
                                Matrícula profesional
                            </label>

                            <input
                                type="number"
                                id="matricula"
                                class="form-control"
                                min="1"
                                step="1"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="valorConsulta" class="form-label">
                                Valor de consulta ($)
                            </label>

                            <input
                                type="number"
                                id="valorConsulta"
                                class="form-control"
                                min="0"
                                step="0.01"
                                required>
                        </div>

                        <!-- Foto -->
                        <div class="mb-3">
                            <label for="fotoVeterinario" class="form-label">
                                Foto del veterinario
                            </label>

                            <input
                                type="file"
                                id="fotoVeterinario"
                                class="form-control"
                                accept="image/*">

                            <div class="form-text">
                                Seleccioná una imagen desde tu computadora.
                                La foto es opcional.
                            </div>

                            <div class="text-center mt-3">
                                <img
                                    id="vistaPreviaFoto"
                                    src=""
                                    alt="Vista previa de la foto"
                                    class="img-thumbnail d-none"
                                    style="width: 180px; height: 180px; object-fit: cover;">
                            </div>
                        </div>

                        <div class="d-flex flex-wrap justify-content-center gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="botonGuardar">
                                Guardar veterinario
                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary d-none"
                                id="botonCancelar">
                                Cancelar edición
                            </button>

                        </div>

                    </form>
                </div>
            </div>

            <section class="mt-5">

                <h2 class="text-center mb-4">
                    Veterinarios registrados
                </h2>

                <div class="row g-4" id="listaVeterinarios"></div>

            </section>

        </section>
    </main>

    <footer class="text-center py-3">
